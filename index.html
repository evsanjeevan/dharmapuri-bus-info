<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />

    <link
        rel="icon"
        type="image/svg+xml"
        href="/favicon.svg"
    />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />

    <!-- App Title & SEO -->
    <title>DPI One | Smarter Bus Search for Dharmapuri. </title>

    <meta
        name="title"
        content="DPI One | Smarter Bus Search for Dharmapuri."
    />

    <meta
        name="description"
        content="Find live bus timings, routes, ticket fares, and intermediate stops across Dharmapuri with DPI One public transit engine."
    />

    <meta
        name="keywords"
        content="DPI One, Dharmapuri Bus Timings, Local Bus Routes, Tamil Nadu Transit, DPI Bus Info"
    />

    <meta
        name="author"
        content="EVS Technology"
    />

    <!-- Mobile / PWA -->
    <meta
        name="theme-color"
        content="#5a4fcf"
        media="(prefers-color-scheme: light)"
    />

    <meta
        name="theme-color"
        content="#111827"
        media="(prefers-color-scheme: dark)"
    />

    <meta
        name="mobile-web-app-capable"
        content="yes"
    />

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    />

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    />

    <meta
        name="apple-mobile-web-app-title"
        content="DPI One"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta
        property="og:title"
        content="DPI One — Dharmapuri Transit Engine"
    />

    <meta
        property="og:description"
        content="Explore verified local and town bus schedules, ticket prices, and route timings in Dharmapuri."
    />

    <meta
        property="og:image"
        content="/og-preview.png"
    />

    <!-- Twitter -->
    <meta
        name="twitter:card"
        content="summary_large_image"
    />

    <meta
        name="twitter:title"
        content="DPI One — Dharmapuri Transit Engine"
    />

    <meta
        name="twitter:description"
        content="Explore verified local and town bus schedules, ticket prices, and route timings in Dharmapuri."
    />

    <!-- Fonts -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap"
        rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
</head>

<body
    class="font-montserrat antialiased bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-white selection:bg-brand selection:text-white transition-colors duration-200"
>
    <div id="root"></div>

    <script
        type="module"
        src="/src/main.jsx"
    ></script>
</body>

</html>
